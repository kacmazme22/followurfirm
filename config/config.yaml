# =============================================================================
# FollowUrFirm — config.yaml
#
# This file holds everything a non-developer should be able to tweak without
# touching Python: which tickers to track, who receives the digest, and which
# data sources are active per market phase.
#
# Secrets (API keys, SMTP password, etc.) do NOT belong here — they live in
# environment variables / .env, loaded by config/settings.py.
# =============================================================================

market_phase: bist  # bist | global | both

tickers:
  bist:
    - symbol: YEOTK
      name: "YEO Teknoloji"
      enabled: true
    - symbol: GUBRF
      name: "Gübre Fabrikaları"
      enabled: false
    - symbol: ULUUN
      name: "Ulusoy Un Sanayi ve Ticaret"
      enabled: false
    - symbol: KCHOL
      name: "Koç Holding"
      enabled: true
    - symbol: SAHOL
      name: "Sabancı Holding"
      enabled: true
    - symbol: AKBNK
      name: "Akbank"
      enabled: true
    - symbol: GLYHO
      name: "Global Yatırım Holding"
      enabled: true
    - symbol: RGYAS
      name: "Rönesans Gayrimenkul Yatırım"
      enabled: true
    
  global: []  # Phase 2 — e.g. AAPL, NVDA, TSLA, PLTR

recipients:
  - "ediz.kacmaz19@gmail.com"

schedule:
  cron_utc: "0 4 * * *"   # informational only: cron-job.org triggers 07:00 and 07:30 Europe/Istanbul (README)
  timezone_display: "Europe/Istanbul"

sources:
  kap:
    enabled: true
    base_url: "https://www.kap.org.tr"
    # Undocumented JSON API (KAP is a Next.js SPA with no server-rendered
    # HTML to scrape) — verified working via a live POST as of 2026-08-03.
    # Requires header Referer: https://www.kap.org.tr/tr/bildirim-sorgu
    # (set in scrapers/kap_scraper.py). Expect this to break silently and
    # need periodic re-verification.
    disclosure_endpoint: "/tr/api/disclosure/members/byCriteria"
    max_items_per_ticker: 10
    politeness:
      min_delay_seconds: 2.0
      max_delay_seconds: 5.0
      user_agent: "Mozilla/5.0 (compatible; FollowUrFirmBot/1.0; +https://github.com/your-org/followurfirm)"

  bigpara:
    enabled: true
    base_url: "https://www.bigpara.com"
    politeness:
      min_delay_seconds: 1.5
      max_delay_seconds: 4.0

  google_news_rss:
    enabled: true
    # {ticker} and {company_name} are substituted at request time.
    # `when:2d` is Google News' own recency operator: without it the feed's
    # 100-item cap filled up with months-old articles and the 36h filter in
    # google_news_scraper.py then dropped all 100 (KCHOL/AKBNK, 2026-10-03).
    # Name OR ticker: requiring both found nothing for RGYAS on 4 of 5 days
    # (2026-10-28..11-01) — headlines say "Rönesans Gayrimenkul" without the
    # ticker, or "RGYAS" without the full name.
    # The parentheses matter: without them Google read it as
    # name OR (ticker when:2d) and returned 2016 articles (2026-11-01).
    query_template_tr: '("{company_name}" OR {ticker}) when:2d'
    language: "tr"
    country: "TR"

  company_ir_pages:
    enabled: true
    # Each ticker's IR site is found automatically (scrapers/ir_scraper.py);
    # nothing to add here for a new ticker. Only to pin pages by hand:
    #   urls:
    #     AKBNK: ["https://www.akbankinvestorrelations.com/tr"]
    urls: {}

  web_search_fallback:
    enabled: true
    trigger_if_items_below: 2   # if a ticker yields < N items from primary sources

  # --- Phase 2 (disabled by default) ---
  sec_edgar:
    enabled: false
    base_url: "https://www.sec.gov"
  yahoo_finance:
    enabled: false
  finviz:
    enabled: false
  pr_newswire:
    enabled: false

ai_synthesis:
  # Tier 1 (always on): rule-based keyword/regex categorization, zero LLM calls.
  rule_based_categorization: true

  # Tier 2 (conditional): only invoked when rule-based pass can't confidently
  # categorize, or when genuine free-text summarization/dedup judgment is
  # needed. Provider is selected via AI_PROVIDER env var — this YAML only
  # controls whether Tier 2 is allowed to run at all.
  llm_synthesis_enabled: true
  llm_trigger:
    # Only call the LLM for a ticker if it has at least this many raw items
    # AND rule-based categorization left at least one item unclassified.
    min_items_to_justify_call: 3

email:
  subject_template: "FollowUrFirm Günlük Bülten — {date}"
  from_display_name: "FollowUrFirm Digest"
  # SMTP host/port/credentials come from env vars (see .env.example)

cache:
  # In-run cache only (not persisted across runs) — avoids redundant hits on
  # the same URL within a single pipeline execution.
  enabled: true

logging:
  level: "INFO"
  json_format: false

# Trial switches for new rules (utils/experiments.py). "on": applied, and
# what it changed is listed in the mail's "Deneme kayıtları" box; "shadow":
# nothing is changed, the box lists what it WOULD have changed; "off".
# Each entry in the box has "doğru · yanlış" links: a rule that proves
# itself stays on, one that misfires is fixed or removed.
experiments:
  buyback_weekly: "on"          # daily buyback trades at most once a week, never the subject
  headline_same_ticker: "on"    # subject figures must come from that company's own items
  kap_form_tail: "on"           # long buyback forms keep their latest rows too
  calendar_near_days: "on"      # calendar line: today and tomorrow (Mondays: the week)
  headline_only_dedup: "on"     # drop a bare headline that repeats an item with text
  no_headline_low_value: "on"   # interviews, events, broker flows etc. never the subject
  llm_repeat_check: "shadow"    # model asks "same event as an earlier mail?"
  same_day_merge: "shadow"      # same event under two labels on one day
